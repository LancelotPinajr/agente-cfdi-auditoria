[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-cfdi"
version = "0.1.0"
description = "Agente de Aseguramiento y Cesión de CFDI — bitácora encadenada, registro de cesiones y anclaje verificable"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
