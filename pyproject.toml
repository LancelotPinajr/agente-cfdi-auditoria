[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-cfdi"
version = "0.1.0"
description = "Agente de Aseguramiento y Cesión de CFDI — bitácora encadenada, registro de cesiones y anclaje verificable"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    # FastAPI NO lo arrastra solo, y sin él `/ingesta` —que recibe `UploadFile`—
    # revienta al importar el módulo, no al llamar al endpoint. En una máquina de
    # desarrollo suele venir instalado por otra cosa y el hueco no se nota; en un
    # entorno limpio tumba todo. Lo encontró el CI.
    "python-multipart>=0.0.9",
    # `api/esquemas.py` lo importa directo. Hoy llega arrastrado por FastAPI,
    # pero depender de la dependencia de otro es depender de algo que nadie
    # prometió: se declara lo que se importa.
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# ADK y su acompañante. Van aparte porque el grueso de las pruebas NO los
# necesita: las herramientas del agente son Python plano justamente para poder
# probarse sin ellos. Este extra existe para el trabajo de CI que comprueba que
# ADK sí acepta esas funciones — si no, el fallo aparecería al arrancar el
# contenedor en Cloud Run y nadie se enteraría hasta el despliegue.
agente = ["google-adk>=2.7", "python-dotenv>=1.0"]

# El anclaje en cadena real. Va aparte porque el ancla simulada —que es la que
# usan las pruebas y la demo— no necesita nada de esto: quien solo quiera correr
# el escenario local no tiene por qué instalar web3.
#
# Se declara `eth-account` aunque `web3` lo arrastre: este código lo importa
# directo, y depender de la dependencia de otro es depender de algo que nadie
# prometió. Mismo criterio que con pydantic.
anclaje = ["web3>=7.0", "eth-account>=0.13"]

# El respaldo de la bitácora a GCS (3.13 y 3.14). Va aparte por la misma razón
# que el anclaje: `RespaldoEnDirectorio` ejercita exactamente el mismo camino de
# código —serializar, subir, recuperar, restaurar— así que las pruebas prueban
# el mecanismo de verdad sin necesitar el SDK de Google Cloud ni credenciales.
respaldo = ["google-cloud-storage>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
