# Que las pruebas pasen en la máquina de quien las escribió no le sirve a nadie
# más. Esto las corre en una máquina limpia, en cada push y en cada PR, para que
# el resultado sea comprobable sin clonar el repo.

name: pruebas

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Un push nuevo cancela la corrida anterior de la misma rama: nadie necesita el
# resultado de un commit que ya fue reemplazado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `pyproject.toml` declara `requires-python = ">=3.11"`. Si solo se
        # probara 3.11, esa declaración sería una promesa sin verificar.
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Correr las pruebas
        run: python -m pytest tests/ -v

  demo:
    # Las pruebas usan TestClient, que no levanta un servidor de verdad. Este
    # trabajo corre el escenario completo contra uvicorn real: ahí salieron dos
    # fallos que las pruebas no veían (ver ADR 0005).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Correr el escenario completo contra uvicorn
        # El servidor y la demo van en el MISMO paso a propósito: cada `run:` es
        # un shell distinto, y un proceso de fondo arrancado en un paso no está
        # garantizado que siga vivo en el siguiente.
        #
        # `tools/demo.py` no solo comprueba que el flujo no truene: verifica que
        # las desviaciones encontradas sean EXACTAMENTE las plantadas, que el
        # folio duplicado se rechace y que la prueba de inclusión no exponga los
        # folios de las demás operaciones. Sale distinto de 0 si algo no cuadra.
        run: |
          set -euo pipefail
          python -m uvicorn agente_cfdi.api.app:app --port 8000 --log-level warning &
          servidor=$!
          trap 'kill $servidor 2>/dev/null || true' EXIT

          for intento in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/salud > /dev/null; then
              echo "la API respondió al intento $intento"
              break
            fi
            if [ "$intento" -eq 30 ]; then
              echo "la API no respondió en 30 segundos"
              exit 1
            fi
            sleep 1
          done

          python tools/demo.py

  agente:
    # Las herramientas se prueban sin ADK a propósito, y eso deja un hueco: que
    # ADK las ACEPTE no lo prueba nadie. Si una firma no le gusta, el fallo
    # aparece al construir el agente — o sea, al arrancar el contenedor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar con ADK
        run: pip install -e ".[dev,agente]"

      - name: ADK acepta las herramientas
        run: python tools/verificar_agente.py
